<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>Moments</title>
<meta name="viewport" content="width=device-width,initial-scale=1,shrink-to-fit=no">
<style>
*{border:0;margin:0;padding:0;box-sizing:border-box}
html{width:100%;height:100%;background:#fff;font:calc(1vw + 1vh) sans-serif}
body{width:100vw;min-height:100%;display:flex;justify-content:center;align-items:center}
object,rust-object{flex:1;max-width:100vw;max-height:100vh}
</style>
<script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.addEventListener("load", (event) => {
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        const container = document.getElementById("container");
        container.appendChild(player);
        player.load("https://github.com/OlivierBATY/Mecamomentsflash/blob/gh-pages/moments.swf");
    });
</script>
<script src="https://github.com/OlivierBATY/Mecamomentsflash/blob/gh-pages/ruffle.js"></script>
</html>
